# Coordinate system: right_handed_z_up_v1
[case]
name = "44_Ar_2_H"
nx = 20

[physics]
plasma_eos = true
gamma = 1.6666666666666667
mu0 = 1.25663706212e-6
artificial_viscosity = 1.0
artificial_thermal_conductivity = 1.0
artificial_magnetic_dissipation = 1.0

[numerics]
kernel = "cubic"
hfact = 1.2
density = "iterate"
cleaning_speed_factor = 1.0
cleaning_damping_factor = 1.0

[solver]
tf = 1.493333333333333e-05                    # s
pfreq = 50
adaptive_timestep = true
timestep_factor = 1.0

[execution]
backend = "cuda"
fused = false
directory = "outputs/44_Ar_2_H"

[argon]
config = "configs/jet/44_Ar.toml"
nx = 20
axial_speed = 70000.0
launch_time = 0.0

[hydrogen]
config = "configs/jet/2_H.toml"
nx = 20
axial_speed = 150000.0
launch_time = 2.933333333333333e-06
