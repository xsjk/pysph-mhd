# Coordinate system: right_handed_z_up_v1
[case]
name = "44_Ar"
nx = 30

[jet]
length = 0.090               # m
radius = 0.040               # m, jet column radius
end_taper_fraction = 0.1     # dimensionless fraction of jet length
axial_speed = 7.0e4          # m/s, full jet reaches the origin by 12.86 us
azimuthal_speed = 2.0e3      # m/s, peak rotation speed
temperature_ev = 2.0         # eV
number_density = 2.0e22      # m^-3, argon ion number density

[physics]
plasma_eos = true
gamma = 1.6666666666666667
mu0 = 1.25663706212e-6
artificial_viscosity = 1.0
artificial_thermal_conductivity = 1.0
artificial_magnetic_dissipation = 1.0

[numerics]
kernel = "cubic"
hfact = 1.2
density = "iterate"
periodic_mode = "none"
cleaning_speed_factor = 1.0
cleaning_damping_factor = 1.0

[solver]
tf = 2.0e-5                  # s
pfreq = 25
adaptive_timestep = true
timestep_factor = 1.0

[execution]
backend = "cuda"
nnps = "gpu_octree"
octree_leaf_size = 512
fused = false
directory = "outputs/44_Ar"

[layout]
radius = 0.81
latitudes_degrees = [60.0, 30.0, 0.0, -30.0, -60.0]
counts = [6, 10, 12, 10, 6]
azimuth_start_degrees = 0.0
