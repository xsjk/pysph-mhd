[case]
name = "alfven"
nx = 64

[physics]
gamma = 1.6666666666666667
mu0 = 1.0
artificial_magnetic_dissipation = 1.0

[numerics]
kernel = "quintic"
hfact = 1.0
density = "iterate"
periodic_mode = "minimum_image"

[solver]
tf = 1.0
pfreq = 20
adaptive_timestep = true

[execution]
backend = "cuda"
fused = true
directory = "outputs/alfven"
