[case]
name = "alfven"
nx = 256

[physics]
gamma = 1.6666666666666667
mu0 = 1.0
artificial_viscosity = 0.0
artificial_thermal_conductivity = 0.0
artificial_magnetic_dissipation = 0.0

[numerics]
kernel = "wendland_c6"
hfact = 1.9
density = "iterate"
periodic_mode = "minimum_image"
cleaning_speed_factor = 0.0
cleaning_damping_factor = 0.0

[solver]
tf = 1.0
pfreq = 20
adaptive_timestep = true
timestep_factor = 0.5

[execution]
backend = "cuda"
fused = true
directory = "outputs/alfven"
