[case]
name = "mhdblast"
nx = 64

[physics]
gamma = 1.4
mu0 = 1.0
artificial_magnetic_dissipation = 1.0

[numerics]
kernel = "cubic"
hfact = 1.2
density = "iterate"
periodic_mode = "minimum_image"

[solver]
tf = 0.02
pfreq = 20
adaptive_timestep = true

[execution]
backend = "cuda"
fused = true
directory = "outputs/mhdblast"
